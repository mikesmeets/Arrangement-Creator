{% extends "base.html" %}
{% set back_url = url_for('vendors') %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1>{{ title }}</h1>
</div>

<form method="POST">
  <div class="form-section">
    <div class="form-section-title">Vendor Info</div>

    <div class="mb-3">
      <label class="form-label">Name *</label>
      <input type="text" name="name" class="form-control"
             value="{{ vendor.name if vendor else '' }}" required placeholder="e.g. Trader Joe's">
    </div>

    <div class="mb-3">
      <label class="form-label">Type</label>
      <select name="vendor_type" class="form-select">
        <option value="">— Select —</option>
        {% for t in ['Wholesale', 'Grocery', 'Retail', 'Online', 'Other'] %}
        <option value="{{ t }}" {% if vendor and vendor.vendor_type == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Location</label>
      <input type="text" name="location" class="form-control"
             value="{{ vendor.location if vendor else '' }}" placeholder="City, State">
    </div>

    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input type="tel" name="phone" class="form-control"
             value="{{ vendor.phone if vendor else '' }}" placeholder="(555) 123-4567">
    </div>

    <div class="mb-3">
      <label class="form-label">Website</label>
      <input type="url" name="website" class="form-control"
             value="{{ vendor.website if vendor else '' }}" placeholder="https://...">
    </div>

    <div class="form-check form-switch mb-1">
      <input class="form-check-input" type="checkbox" name="wholesale_relationship" id="wholesale"
             {% if vendor and vendor.wholesale_relationship %}checked{% endif %}>
      <label class="form-check-label fw-semibold" for="wholesale">Wholesale Relationship</label>
    </div>
    <div class="text-muted" style="font-size:12px;padding-left:44px">Has an established wholesale account</div>
  </div>

  <div class="px-3 pb-4">
    <button type="submit" class="btn btn-primary-green w-100">
      <i class="bi bi-check-lg me-1"></i> {{ 'Save Changes' if vendor else 'Add Vendor' }}
    </button>
  </div>
</form>
{% endblock %}
